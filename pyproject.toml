[project]
name = "slack-assistant-prod"
version = "1.0.0"
description = "Production deployment of the multi-user Slack-native AI assistant"
requires-python = ">=3.12"
dependencies = [
    # Slack
    "slack-bolt>=1.21.2",
    "slack-sdk>=3.33.4",
    "aiohttp>=3.13.5",
    # HTTP / web
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "httpx>=0.28.0",
    "itsdangerous>=2.2.0",
    # Anthropic SDK
    "anthropic>=0.40.0",
    # DB — Postgres (asyncpg) for prod, aiosqlite kept for compatibility/local-test
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.1",
    # Google
    "google-api-python-client>=2.151.0",
    "google-auth>=2.36.0",
    "google-auth-oauthlib>=1.2.1",
    "google-auth-httplib2>=0.2.0",
    # Config / logging / utils
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "loguru>=0.7.2",
    "cryptography>=43.0.3",
    "python-dateutil>=2.9.0",
    "dateparser>=1.2.0",
    "pytz>=2024.2",
    # Observability
    "braintrust>=0.0.170",
    "openinference-instrumentation-anthropic>=0.1.14",
    "openinference-semantic-conventions>=0.1.14",
    "opentelemetry-api>=1.28.2",
    "opentelemetry-sdk>=1.28.2",
    "opentelemetry-exporter-otlp>=1.28.2",
    "matplotlib>=3.10.9",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "python-docx>=1.2.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
