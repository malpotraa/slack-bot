# Cloud Build pipeline: build image → push to Artifact Registry → deploy to Cloud Run.
#
# Trigger this manually from infrastructure/04-build-and-deploy.sh, or wire it
# to a Git push trigger from the Cloud Build console.
#
# Substitutions you can override at build time:
#   _REGION             default: us-central1
#   _SERVICE_NAME       default: slack-assistant
#   _AR_REPO            default: slack-assistant
#   _SQL_INSTANCE       e.g. PROJECT:REGION:INSTANCE  (set by 04-build-and-deploy.sh)
#   _APP_BASE_URL       e.g. https://slack-assistant-XXXX-uc.a.run.app

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: pronto
  _AR_REPO: pronto
  _SQL_INSTANCE: ""
  _APP_BASE_URL: ""
  _PHOENIX_ENDPOINT: https://app.phoenix.arize.com
  _RUN_SA_EMAIL: ""

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ── Build ────────────────────────────────────────────────────────────
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$BUILD_ID
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest
      - .

  # ── Push ─────────────────────────────────────────────────────────────
  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}

  # ── Deploy to Cloud Run ─────────────────────────────────────────────
  # Note: SLACK_CLIENT_ID, GOOGLE_CLIENT_ID, WRIKE_CLIENT_ID are intentionally
  # injected via --update-secrets (just like the *_SECRET ones). Earlier we
  # tried using --set-env-vars with $$VAR shell expansion via Cloud Build's
  # `availableSecrets`, but gcloud is invoked directly (no shell), so the $$
  # never expands and the literal text "$VAR" was being stored as the env value.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      # Always-on CPU is REQUIRED for Slack Socket Mode. Default CPU throttling
      # only powers the container during HTTP requests; the outbound WebSocket
      # stalls between requests and Slack drops the session.
      - --no-cpu-throttling
      # Pin to exactly one instance: each replica opens its own Socket Mode
      # connection, but Slack delivers an event to only one — extra replicas
      # would silently miss the events that landed on the other.
      - --min-instances=1
      - --max-instances=1
      - --timeout=3600
      - --concurrency=80
      - --execution-environment=gen2
      - --service-account=${_RUN_SA_EMAIL}
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      - --update-secrets=APP_SECRET_KEY=PRONTO_APP_SECRET_KEY:latest,TOKEN_ENCRYPTION_KEY=PRONTO_TOKEN_ENCRYPTION_KEY:latest,DATABASE_URL=PRONTO_DATABASE_URL:latest,ANTHROPIC_API_KEY=PRONTO_ANTHROPIC_API_KEY:latest,SLACK_BOT_TOKEN=PRONTO_SLACK_BOT_TOKEN:latest,SLACK_APP_TOKEN=PRONTO_SLACK_APP_TOKEN:latest,SLACK_SIGNING_SECRET=PRONTO_SLACK_SIGNING_SECRET:latest,SLACK_CLIENT_ID=PRONTO_SLACK_CLIENT_ID:latest,SLACK_CLIENT_SECRET=PRONTO_SLACK_CLIENT_SECRET:latest,GOOGLE_CLIENT_ID=PRONTO_GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=PRONTO_GOOGLE_CLIENT_SECRET:latest,GOOGLE_ADS_DEVELOPER_TOKEN=PRONTO_GOOGLE_ADS_DEVELOPER_TOKEN:latest,GOOGLE_ADS_LOGIN_CUSTOMER_ID=PRONTO_GOOGLE_ADS_LOGIN_CUSTOMER_ID:latest,WRIKE_CLIENT_ID=PRONTO_WRIKE_CLIENT_ID:latest,WRIKE_CLIENT_SECRET=PRONTO_WRIKE_CLIENT_SECRET:latest,PHOENIX_API_KEY=PRONTO_PHOENIX_API_KEY:latest
      - --set-env-vars=APP_ENV=prod,LOG_LEVEL=INFO,APP_BASE_URL=${_APP_BASE_URL},PHOENIX_PROJECT_NAME=pronto,PHOENIX_COLLECTOR_ENDPOINT=${_PHOENIX_ENDPOINT},GOOGLE_ADS_API_VERSION=v22

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest

timeout: 1500s
